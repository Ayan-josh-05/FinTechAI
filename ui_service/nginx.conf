server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Enable brotli compression (if brotli module is available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/json
    #     application/javascript
    #     application/xml+rss
    #     application/atom+xml
    #     image/svg+xml
    #     font/woff
    #     font/woff2;

    # Serve pre-compressed brotli JavaScript files
    location ~ \.js\.br$ {
        gzip off;
        add_header Content-Encoding br always;
        add_header Content-Type "application/javascript" always;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    # Serve pre-compressed brotli CSS files
    location ~ \.css\.br$ {
        gzip off;
        add_header Content-Encoding br always;
        add_header Content-Type "text/css" always;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    # Serve pre-compressed gzip JavaScript files
    location ~ \.js\.gz$ {
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Content-Type "application/javascript" always;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    # Serve pre-compressed gzip CSS files
    location ~ \.css\.gz$ {
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Content-Type "text/css" always;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    # Serve JavaScript and CSS files (with automatic compression fallback)
    location ~* \.(js|css)$ {
        # Enable serving pre-compressed files if available
        gzip_static on;
        
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Vary Accept-Encoding always;
        access_log off;
    }

    # Handle other static files with regular compression
    location ~* \.(html|xml|json|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Vary Accept-Encoding always;
        access_log off;
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache other static assets (images, fonts) without compression
    location ~* \.(png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

